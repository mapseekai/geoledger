[workspace]
members = ["crates/spatialite", "crates/core", "crates/engine", "crates/server", "crates/rpc", "sdk/rust", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
geoledger-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
thiserror = "2"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
