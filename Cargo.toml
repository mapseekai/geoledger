[workspace]
members = ["crates/core", "crates/storage", "crates/postgis", "crates/app", "crates/server", "crates/thrift-gen", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
geoledger-core = { path = "crates/core" }
geoledger-storage = { path = "crates/storage" }
geoledger-postgis = { path = "crates/postgis" }
geoledger = { path = "crates/app" }
geoledger-server = { path = "crates/server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
