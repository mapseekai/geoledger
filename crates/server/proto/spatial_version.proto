syntax = "proto3";
package spatial.version.v1;

// Versioned control-plane API. Common requests are typed. JSON result envelopes
// preserve arbitrary dataset schemas and exact scalar strings in the MVP.
service SpatialVersion {
  rpc Execute(ExecuteRequest) returns (JsonReply);
  rpc Status(StatusRequest) returns (JsonReply);
  rpc Import(ImportRequest) returns (JsonReply);
  rpc Commit(CommitRequest) returns (JsonReply);
  rpc Log(LogRequest) returns (JsonReply);
  rpc Diff(DiffRequest) returns (JsonReply);
  rpc Branch(BranchRequest) returns (JsonReply);
  rpc Switch(ReferenceRequest) returns (JsonReply);
  rpc Merge(MergeRequest) returns (JsonReply);
  rpc Revert(MergeRequest) returns (JsonReply);
  rpc Reset(ResetRequest) returns (JsonReply);
  rpc Restore(RestoreRequest) returns (JsonReply);
  rpc Continue(Empty) returns (JsonReply);
  rpc Abort(Empty) returns (JsonReply);
  rpc Recover(Empty) returns (JsonReply);
}
message Empty {}
message JsonReply { string json = 1; }
message ExecuteRequest { string command_json = 1; }
message StatusRequest { uint32 limit = 1; }
message CommitRequest { string message = 1; string author = 2; }
message ImportRequest { string dataset = 1; string schema = 2; string table = 3; string author = 4; string message = 5; }
message LogRequest { string reference = 1; uint32 limit = 2; }
message DiffRequest { string from = 1; string to = 2; uint32 limit = 3; }
message BranchRequest { string name = 1; string from = 2; }
message ReferenceRequest { string reference = 1; }
message MergeRequest { string reference = 1; string author = 2; string message = 3; }
message ResetRequest { string target = 1; bool hard = 2; }
message RestoreRequest { bool discard = 1; }
