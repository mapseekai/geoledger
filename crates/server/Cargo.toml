[package]
name = "geoledger-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["thrift"]
thrift = ["dep:volo", "dep:volo-thrift", "dep:pilota", "dep:geoledger-thrift-gen"]

[[example]]
name = "thrift_client"
required-features = ["thrift"]

[dependencies]
geoledger.workspace = true
geoledger-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = "0.8"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-reflection = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
subtle = "2"
tracing = "0.1"
volo = { version = "0.12.4", optional = true }
volo-thrift = { version = "0.12.6", optional = true }
pilota = { version = "0.13", optional = true }
geoledger-thrift-gen = { path = "../thrift-gen", optional = true }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
geoledger-postgis.workspace = true
postgres = "0.19"
uuid.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
