edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
geoledger.workspace = true
geoledger-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = "0.8"
tonic = "0.14"
