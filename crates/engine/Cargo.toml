[package]
name = "geoledger-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
geoledger-core.workspace = true
geoledger-spatialite = { path = "../spatialite" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
bytes = "1"
uuid.workspace = true
tokio.workspace = true
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks"] }
geo = "0.33"
geojson = { version = "1.0", features = ["geo-types"] }

[features]
# Exposes `fuzzing` entry points for the cargo-fuzz targets in fuzz/.
fuzzing = []

[dev-dependencies]
tempfile.workspace = true
postgres = "0.19"

[lints]
workspace = true
