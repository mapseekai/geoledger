services:
  geoledger:
    build: .
    ports:
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882"
    volumes:
      - geoledger-data:/data
    restart: unless-stopped
    stop_grace_period: 60s
  console:
    profiles: [console]
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GL_WEB_ENDPOINT: http://geoledger:7882
      GL_WEB_ORIGIN: ${GL_WEB_ORIGIN:-http://localhost:3000}
      GL_WEB_SESSION_SECRET: ${GL_WEB_SESSION_SECRET:-}
    depends_on:
      - geoledger
    restart: unless-stopped
volumes:
  geoledger-data:
