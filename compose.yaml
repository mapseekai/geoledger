services:
  geoledger:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882"
    volumes:
      - geoledger-data:/data
    environment:
      GL_WEB_ORIGIN: ${GL_WEB_ORIGIN:-http://localhost:3000}
      GL_WEB_SESSION_SECRET: ${GL_WEB_SESSION_SECRET:?set GL_WEB_SESSION_SECRET}
      GL_ADMIN_USERNAME: ${GL_ADMIN_USERNAME:-admin}
      # Unset values are omitted so the server generates its private bootstrap password.
      GL_ADMIN_PASSWORD:
      GL_WEB_BASEMAP_URL: ${GL_WEB_BASEMAP_URL:-}
      GL_WEB_BASEMAP_ATTRIBUTION: ${GL_WEB_BASEMAP_ATTRIBUTION:-}
      GL_SHUTDOWN_DRAIN_SECS: "5"
      GL_SHUTDOWN_TIMEOUT_SECS: "40"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "/app/container.cjs", "probe"]
      interval: 15s
      timeout: 8s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 60s
volumes:
  geoledger-data:
