{
  "id": "await-in-promise-all-ts",
  "valid": [
    "async function f() { await Promise.all([a(), b()]); }",
    "async function f() { await Promise.all([(async () => { await a(); })(), b()]); }",
    "async function f() { const a = await first(); await Promise.all([next(a), b()]); }",
    "async function f() { await Promise.all([items.map(async x => await work(x))]); }"
  ],
  "invalid": [
    "async function f() { await Promise.all([await a(), b()]); }",
    "async function f() { await Promise.all([a(), await b()]); }"
  ]
}
