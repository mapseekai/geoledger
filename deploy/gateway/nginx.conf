# Reference TLS gateway for GeoLedger (nginx >= 1.25.1).
# Terminates TLS for the HTTP API, gRPC and the web console; upstreams stay on a private
# network. Replace the server_name values and certificate paths. Verified by
# scripts/test-gateway.sh, which renders this file against local upstreams.
worker_processes auto;
events { worker_connections 1024; }
http {
    server_tokens off;
    # The request ID is forwarded to GeoLedger, which logs it with every access entry.
    map $http_x_request_id $gl_request_id { default $http_x_request_id; "" $request_id; }
    log_format gl escape=json '{"time":"$time_iso8601","remote":"$remote_addr","host":"$host",'
        '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"request_id":"$gl_request_id"}';
    access_log /dev/stdout gl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:gl_tls:10m;
    ssl_session_tickets off;
    ssl_certificate     /etc/geoledger/tls/gateway.crt;
    ssl_certificate_key /etc/geoledger/tls/gateway.key;
    # Brute-force and burst protection at the edge; GeoLedger also limits per principal/IP.
    limit_req_zone $binary_remote_addr zone=gl_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=gl_api:10m rate=50r/s;
    limit_req_status 429;

    upstream geoledger_http { server geoledger:7881; keepalive 16; }
    upstream geoledger_grpc { server geoledger:7882; keepalive 16; }
    upstream geoledger_console { server console:3000; keepalive 16; }

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }
    # HTTP API: /api/v1/*, /health, /ready, /metrics.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.geoledger.example;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        client_max_body_size 5m;
        location / {
            limit_req zone=gl_api burst=100 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $gl_request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_pass http://geoledger_http;
        }
    }
    # gRPC for SDKs and the gl CLI (endpoint https://grpc.geoledger.example:443).
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name grpc.geoledger.example;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        client_max_body_size 5m;
        location / {
            limit_req zone=gl_api burst=100 nodelay;
            grpc_set_header X-Request-Id $gl_request_id;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_read_timeout 60s;
            grpc_send_timeout 60s;
            grpc_pass grpc://geoledger_grpc;
        }
    }
    # Web console. GL_WEB_ORIGIN must be https://console.geoledger.example.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name console.geoledger.example;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        client_max_body_size 5m;
        location = /api/session {
            limit_req zone=gl_login burst=5 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $gl_request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://geoledger_console;
        }
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $gl_request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://geoledger_console;
        }
    }
}
