name: Service, storage and SDK correctness
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable commit checked by every required job
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: geoledger-ci-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}
  # A required release gate must not be cancelled by another call for the same SHA.
  cancel-in-progress: ${{ !inputs.source_sha }}
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Require immutable source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: python3 -c 'import os,re; assert re.fullmatch(r"[0-9a-f]{40}", os.environ["SOURCE_SHA"]), "full commit SHA required"'
  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgis:
        image: postgis/postgis@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6 # 17-3.5 (official image)
        env:
          POSTGRES_USER: mapseekai
          POSTGRES_DB: geoledger_test
          POSTGRES_PASSWORD: geoledger-ci-disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mapseekai -d geoledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GL_TEST_DATABASE_URL: postgresql://mapseekai:geoledger-ci-disposable@127.0.0.1:5432/geoledger_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      - name: Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev libsqlite3-mod-spatialite nginx-light
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0
          python3 -m pip install grpcio-tools==1.78.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          npm ci --prefix sdk/ts
      - name: Shared contracts and service lifecycle
        run: ./scripts/check.sh
      - name: Generated SDK reproducibility
        run: |
          ./scripts/generate-sdk.sh
          git diff --exit-code -- sdk/go/internal/geoledgerv1 sdk/python/geoledger/_internal sdk/ts/src/_internal
      - name: SDK roundtrip on both backends
        run: |
          set -euo pipefail
          cargo build --locked --workspace --bins --examples
          for backend in sqlite postgis; do
            export GL_DATA_DIR="$RUNNER_TEMP/geoledger-$backend"
            export GL_ENDPOINT=http://127.0.0.1:7882
            export GL_TOKEN_FILE="$GL_DATA_DIR/admin-credentials.json"
            mkdir -p "$GL_DATA_DIR"
            target/debug/geoledger-server tokens --out "$GL_DATA_DIR/tokens.json" --client-out "$GL_TOKEN_FILE" admin
            if [[ "$backend" == postgis ]]; then
              export GL_DATABASE_URL="$GL_TEST_DATABASE_URL"
            else
              unset GL_DATABASE_URL
            fi
            target/debug/geoledger-server --storage "$backend" --token-file "$GL_DATA_DIR/tokens.json" > "$RUNNER_TEMP/server-$backend.log" 2>&1 &
            service_pid=$!
            trap 'kill "$service_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 100); do
              if curl --fail --silent http://127.0.0.1:7881/ready >/dev/null; then break; fi
              sleep .1
            done
            ./scripts/test-sdks.sh
            kill -TERM "$service_pid"
            wait "$service_pid"
            trap - EXIT
          done
      - name: Reference TLS gateway
        run: ./scripts/test-gateway.sh
  web:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Web dependencies and production checks
        run: |
          npm ci --prefix sdk/ts
          npm --prefix sdk/ts run build
          npm ci --prefix web
          npm --prefix web test
          npm --prefix web run typecheck
          npm --prefix web run format:check
          npm --prefix web run build
      - name: Browser toolchain and service
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev libsqlite3-mod-spatialite
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 build --locked -p geoledger-server
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser to Next.js to TS SDK to GeoLedger
        env:
          GL_WEB_ORIGIN: http://127.0.0.1:3000
          GL_WEB_ENDPOINT: http://127.0.0.1:7896
        run: |
          set -euo pipefail
          export GL_WEB_SESSION_SECRET="$(openssl rand -base64 48)"
          target/debug/geoledger-server --data-dir "$RUNNER_TEMP/console-data" --http 127.0.0.1:7895 --grpc 127.0.0.1:7896 > "$RUNNER_TEMP/console-backend.log" 2>&1 &
          backend_pid=$!
          npm --prefix web start > "$RUNNER_TEMP/console-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null && curl --fail --silent http://127.0.0.1:7895/ready >/dev/null; then break; fi
            sleep .2
          done
          python3 scripts/test-console.py --url http://127.0.0.1:3000 --token-file "$RUNNER_TEMP/console-data/admin-credentials.json"
  msrv:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev libsqlite3-mod-spatialite
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --workspace --all-targets --locked
  windows:
    needs: source
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12'
      - name: Spatial runtime (checksum-pinned, isolated)
        shell: pwsh
        run: python scripts/install-spatialite.py --destination "$env:RUNNER_TEMP/geoledger-native"
      - name: Rust and protoc
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.92.0 --profile minimal --component clippy
          rustup default 1.92.0
          gh release download v35.1 --repo protocolbuffers/protobuf --pattern protoc-35.1-win64.zip --dir $env:RUNNER_TEMP
          $archive = Join-Path $env:RUNNER_TEMP 'protoc-35.1-win64.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5d3ff218d7d91eea95f7569bcb5a98f3030f8996d44151279d9772edcff76082') { throw 'protoc checksum mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          (Join-Path $tools 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p geoledger-server
      - name: Real Windows native spatial startup
        shell: pwsh
        run: python scripts/smoke-server.py --binary target/debug/geoledger-server.exe --runtime "$env:RUNNER_TEMP/geoledger-native"
  supply-chain:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Audit using the exact patched toolchain required by the module.
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      - name: Scanners
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 install --locked cargo-audit@0.22.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          pipx install pip-audit==2.9.0
      - name: Dependency advisories (Rust, npm, Go, Python)
        run: ./scripts/audit.sh
