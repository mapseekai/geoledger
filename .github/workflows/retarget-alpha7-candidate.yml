name: One-time approved alpha.7 candidate adjustment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-refs/tags/v0.3.0-alpha.7
  cancel-in-progress: false
jobs:
  retarget:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify unpublished state and apply the approved exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: mapseekai/geoledger
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          REPO = 'mapseekai/geoledger'
          TAG = 'v0.3.0-alpha.7'
          OLD = '7af658fe657886e2880e3cd20786dd465ce0036d'
          NEW = '669cb4c842848ef8be5427adcc4041389f89eab0'
          RUN = 40317711084

          def api(path, *args):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + REPO + '/' + path, *args], text=True))

          def validate(ref, releases, run, jobs, comparison, image_status):
              if ref['object']['type'] != 'commit' or ref['object']['sha'] not in (OLD, NEW):
                  raise ValueError('candidate tag has an unexpected identity')
              if any(r['tag_name'] == TAG for page in releases for r in page):
                  raise ValueError('an existing Release must not be changed')
              if image_status != 404:
                  raise ValueError('image absence was not confirmed')
              if run['head_sha'] != OLD or run['conclusion'] != 'failure' or run['path'] != '.github/workflows/source-docker-release.yml':
                  raise ValueError('original failed run differs')
              if jobs['total_count'] != len(jobs['jobs']):
                  raise ValueError('original job inventory is incomplete')
              images = [j for j in jobs['jobs'] if j['name'] == 'images' or j['name'].startswith('images / ')]
              if not images or any(j['conclusion'] != 'skipped' for j in images):
                  raise ValueError('original image publication was not skipped')
              if comparison['status'] not in ('ahead', 'identical'):
                  raise ValueError('approved candidate is not on main')
              return ref['object']['sha'] == OLD

          def main():
              ref = api('git/ref/tags/' + TAG)
              releases = api('releases?per_page=100', '--paginate', '--slurp')
              run = api(f'actions/runs/{RUN}')
              jobs = api(f'actions/runs/{RUN}/jobs?per_page=100')
              comparison = api(f'compare/{NEW}...main')
              request = urllib.request.Request('https://hub.docker.com/v2/repositories/zwishing/geoledger/tags/0.3.0-alpha.7', headers={'User-Agent': 'geoledger-release'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      image_status = response.status
              except urllib.error.HTTPError as error:
                  image_status = error.code
              if validate(ref, releases, run, jobs, comparison, image_status):
                  # The user authorized only this unpublished old-to-new candidate adjustment.
                  api('git/refs/tags/' + TAG, '--method', 'PATCH', '-f', 'sha=' + NEW, '-F', 'force=true')
              if api('git/ref/tags/' + TAG)['object']['sha'] != NEW:
                  raise ValueError('candidate adjustment did not persist')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write(f'Approved unpublished candidate adjustment: `{TAG}`\n\n`{OLD}` -> `{NEW}`\n\nNo Release or image was published by this operation.\n')

          if __name__ == '__main__':
              main()
          PY
