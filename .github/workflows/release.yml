name: Release
# Tag vX.Y.Z (or vX.Y.Z-alpha.N) on main. Builds signed multi-arch images and
# binaries with SBOMs and provenance, creates the GitHub release, then publishes
# the TypeScript (npm) and Python (PyPI) SDKs after credential preflight and
# tags the Go module. The Rust client is consumed from git until geoledger-rpc
# vendors its proto for crates.io packaging.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ github.sha }}
  credentials:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Require all SDK publishing configuration
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PYPI_ENABLED: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
        run: |
          test -n "$NPM_TOKEN" || { echo "NPM_TOKEN is required"; exit 1; }
          test "$PYPI_ENABLED" = true || { echo "PyPI trusted publishing is required"; exit 1; }
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: version
        name: Exact tag and all package versions
        run: python3 scripts/check-release-version.py --tag "$GITHUB_REF_NAME"
  binaries:
    needs: [verify, quality, credentials]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Replaces the former windows-cli / center-windows packaging workflows.
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ec52d0af729a7c50ced4261d17a07916f43f5b8e
        with:
          python-version: '3.12'
      - name: Spatial runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/install-spatialite.py --destination "$env:RUNNER_TEMP/geoledger-native"
      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake protobuf-compiler pkg-config libssl-dev libsqlite3-mod-spatialite
          rustup toolchain install 1.92.0 --profile minimal
      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nasm --version=2.16.03 --no-progress -y
          "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install 1.92.0 --profile minimal
          gh release download v35.1 --repo protocolbuffers/protobuf --pattern protoc-35.1-win64.zip --dir $env:RUNNER_TEMP
          $archive = Join-Path $env:RUNNER_TEMP 'protoc-35.1-win64.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5d3ff218d7d91eea95f7569bcb5a98f3030f8996d44151279d9772edcff76082') { throw 'protoc checksum mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          (Join-Path $tools 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build, smoke test and package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo +1.92.0 build --release --locked --bins --target "$TARGET"
          exe=$([[ $RUNNER_OS == Windows ]] && echo .exe || true)
          out="target/$TARGET/release"
          "$out/geoledger-server$exe" --version
          "$out/gl$exe" --version
          dist="geoledger-$VERSION-$TARGET"
          mkdir "$dist"
          cp "$out/geoledger-server$exe" "$out/gl$exe" LICENSE README.md CHANGELOG.md "$dist/"
          if [[ $RUNNER_OS == Windows ]]; then
            cp scripts/install-spatialite.py .security/windows-spatialite.lock.json "$dist/"
            python scripts/smoke-server.py --binary "$dist/geoledger-server$exe" --runtime "$RUNNER_TEMP/geoledger-native"
          else
            python scripts/smoke-server.py --binary "$dist/geoledger-server$exe"
          fi
          if [[ $RUNNER_OS == Windows ]]; then
            7z a -tzip "$dist.zip" "$dist" >/dev/null
            sha256sum "$dist.zip" > "$dist.zip.sha256"
          else
            tar czf "$dist.tar.gz" "$dist"
            sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"
          fi
      - name: Source SBOM (Cargo.lock, npm and Go lockfiles; identical for every target)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: geoledger-${{ needs.verify.outputs.version }}-source.spdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            geoledger-*.tar.gz
            geoledger-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: |
            geoledger-*.tar.gz
            geoledger-*.zip
            geoledger-*.sha256
            geoledger-*.spdx.json
          if-no-files-found: error
  images:
    needs: [verify, quality, credentials]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/secure-images.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.verify.outputs.version }}
      namespace: ghcr.io/${{ github.repository_owner }}
  github-release:
    needs: [verify, binaries, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: image-inventory-*
          merge-multiple: true
          path: dist
      - name: Validate complete image inventory
        run: |
          python3 - <<'PYTHON'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('audit', 'scripts/audit-published-images.py')
          audit = importlib.util.module_from_spec(spec); spec.loader.exec_module(audit)
          audit.validate_inventories([json.loads(p.read_text()) for p in Path('dist').glob('*-images.json')], os.environ['GITHUB_SHA'])
          PYTHON
      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          # Keep the release draft until installed SDK acceptance succeeds.
          python3 scripts/release-resume.py release --path dist
  sdks:
    needs: [verify, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: TypeScript client (npm, provenance)
        run: |
          npm ci --prefix sdk/ts
          npm --prefix sdk/ts run build
          mkdir -p sdk-packages
          npm pack ./sdk/ts --pack-destination sdk-packages
          python3 scripts/release-resume.py npm --path sdk-packages/*.tgz
      - name: Python client build
        run: |
          python3 -m pip install build==1.2.2
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          python3 -m build sdk/python --outdir sdk/python/dist
      - name: Verify previously published Python packages
        id: python-packages
        run: python3 scripts/release-resume.py pypi --path sdk/python/dist
      - name: Python client (PyPI trusted publishing)
        if: steps.python-packages.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist
      - name: Go module tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-resume.py go

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: packaged-binary
      - name: Install published SDKs in clean environments
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsqlite3-mod-spatialite
          (cd packaged-binary && sha256sum -c *.tar.gz.sha256 && tar xzf *.tar.gz)
          mkdir "$RUNNER_TEMP/sdk-consumer"
          cd "$RUNNER_TEMP/sdk-consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --save-exact "@geoledger/client@$VERSION"
          sed 's#require("../dist")#require("@geoledger/client")#' "$GITHUB_WORKSPACE/sdk/ts/test/smoke.cjs" > smoke.cjs
          python3 -m venv python
          python/bin/pip install "geoledger-client==$VERSION"
          cp "$GITHUB_WORKSPACE/sdk/python/tests/smoke.py" smoke.py
          python3 "$GITHUB_WORKSPACE/scripts/smoke-server.py" --binary "$GITHUB_WORKSPACE/packaged-binary/geoledger-$VERSION-x86_64-unknown-linux-gnu/geoledger-server" --sdk-consumer "$PWD"

  complete:
    needs: [verify, github-release, sdks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
