name: Release
# Tag vX.Y.Z (or vX.Y.Z-alpha.N) on main. Builds signed multi-arch images and
# binaries with SBOMs and provenance, creates the GitHub release, then publishes
# the TypeScript (npm) and Python (PyPI) SDKs when credentials are configured and
# tags the Go module. The Rust client is consumed from git until geoledger-rpc
# vendors its proto for crates.io packaging.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ github.sha }}
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: version
        name: Exact tag and all package versions
        run: python3 scripts/check-release-version.py --tag "$GITHUB_REF_NAME"
  binaries:
    needs: [verify, quality]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Replaces the former windows-cli / center-windows packaging workflows.
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12'
      - name: Spatial runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/install-spatialite.py --destination "$env:RUNNER_TEMP/geoledger-native"
      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev libsqlite3-mod-spatialite
          rustup toolchain install 1.92.0 --profile minimal
      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.92.0 --profile minimal
          gh release download v35.1 --repo protocolbuffers/protobuf --pattern protoc-35.1-win64.zip --dir $env:RUNNER_TEMP
          $archive = Join-Path $env:RUNNER_TEMP 'protoc-35.1-win64.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5d3ff218d7d91eea95f7569bcb5a98f3030f8996d44151279d9772edcff76082') { throw 'protoc checksum mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          (Join-Path $tools 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build, smoke test and package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo +1.92.0 build --release --locked --bins --target "$TARGET"
          exe=$([[ $RUNNER_OS == Windows ]] && echo .exe || true)
          out="target/$TARGET/release"
          "$out/geoledger-server$exe" --version
          "$out/gl$exe" --version
          dist="geoledger-$VERSION-$TARGET"
          mkdir "$dist"
          cp "$out/geoledger-server$exe" "$out/gl$exe" LICENSE README.md CHANGELOG.md "$dist/"
          if [[ $RUNNER_OS == Windows ]]; then
            cp scripts/install-spatialite.py .security/windows-spatialite.lock.json "$dist/"
            python scripts/smoke-server.py --binary "$dist/geoledger-server$exe" --runtime "$RUNNER_TEMP/geoledger-native"
          else
            python scripts/smoke-server.py --binary "$dist/geoledger-server$exe"
          fi
          if [[ $RUNNER_OS == Windows ]]; then
            7z a -tzip "$dist.zip" "$dist" >/dev/null
            sha256sum "$dist.zip" > "$dist.zip.sha256"
          else
            tar czf "$dist.tar.gz" "$dist"
            sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"
          fi
      - name: Source SBOM (Cargo.lock, npm and Go lockfiles; identical for every target)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: geoledger-${{ needs.verify.outputs.version }}-source.spdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            geoledger-*.tar.gz
            geoledger-*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: |
            geoledger-*.tar.gz
            geoledger-*.zip
            geoledger-*.sha256
            geoledger-*.spdx.json
          if-no-files-found: error
  images:
    needs: [verify, quality]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/secure-images.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.verify.outputs.version }}
      namespace: ghcr.io/${{ github.repository_owner }}
  github-release:
    needs: [verify, binaries, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: image-inventory-*
          merge-multiple: true
          path: dist
      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --title "GeoLedger $VERSION" --notes-file notes.md --verify-tag $prerelease
  sdks:
    needs: [verify, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: TypeScript client (npm, provenance)
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          npm ci --prefix sdk/ts
          npm --prefix sdk/ts run build
          tag=$([[ "${{ needs.verify.outputs.version }}" == *-* ]] && echo next || echo latest)
          npm publish ./sdk/ts --provenance --access public --tag "$tag"
      - name: Python client build
        run: |
          python3 -m pip install build==1.2.2
          python3 -m build sdk/python --outdir sdk/python/dist
      - name: Python client (PyPI trusted publishing)
        if: ${{ vars.PYPI_TRUSTED_PUBLISHING == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist
      - name: Go module tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/git/refs -f ref="refs/tags/sdk/go/${GITHUB_REF_NAME}" -f sha="${GITHUB_SHA}"
