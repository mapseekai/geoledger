name: Release
# Tag vX.Y.Z (or vX.Y.Z-alpha.N) on main. Builds signed multi-arch images and
# binaries with SBOMs and provenance, creates the GitHub release, then publishes
# the TypeScript (npm) and Python (PyPI) SDKs when credentials are configured and
# tags the Go module. The Rust client is consumed from git until geoledger-rpc
# vendors its proto for crates.io packaging.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Tag matches every package version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" Cargo.toml
          grep -q "\"version\": \"$version\"" sdk/ts/package.json
          python_version=$(sed -E 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/' <<<"$version")
          grep -q "^version = \"$python_version\"" sdk/python/pyproject.toml
          grep -q "## \[$version\]" CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
  binaries:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Replaces the former windows-cli / center-windows packaging workflows.
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev libsqlite3-mod-spatialite
          rustup toolchain install 1.92.0 --profile minimal
      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.92.0 --profile minimal
          gh release download v35.1 --repo protocolbuffers/protobuf --pattern protoc-35.1-win64.zip --dir $env:RUNNER_TEMP
          $archive = Join-Path $env:RUNNER_TEMP 'protoc-35.1-win64.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5d3ff218d7d91eea95f7569bcb5a98f3030f8996d44151279d9772edcff76082') { throw 'protoc checksum mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          (Join-Path $tools 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build, smoke test and package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo +1.92.0 build --release --locked --bins --target "$TARGET"
          exe=$([[ $RUNNER_OS == Windows ]] && echo .exe || true)
          out="target/$TARGET/release"
          "$out/geoledger-server$exe" --version
          "$out/gl$exe" --version
          dist="geoledger-$VERSION-$TARGET"
          mkdir "$dist"
          cp "$out/geoledger-server$exe" "$out/gl$exe" LICENSE README.md CHANGELOG.md "$dist/"
          if [[ $RUNNER_OS == Windows ]]; then
            7z a -tzip "$dist.zip" "$dist" >/dev/null
            sha256sum "$dist.zip" > "$dist.zip.sha256"
          else
            tar czf "$dist.tar.gz" "$dist"
            sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"
          fi
      - name: Source SBOM (Cargo.lock, npm and Go lockfiles; identical for every target)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: geoledger-${{ needs.verify.outputs.version }}-source.spdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            geoledger-*.tar.gz
            geoledger-*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: |
            geoledger-*.tar.gz
            geoledger-*.zip
            geoledger-*.sha256
            geoledger-*.spdx.json
          if-no-files-found: error
  images:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - name: geoledger
            file: Dockerfile
          - name: geoledger-console
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done
  github-release:
    needs: [verify, binaries, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --title "GeoLedger $VERSION" --notes-file notes.md --verify-tag $prerelease
  sdks:
    needs: [verify, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: TypeScript client (npm, provenance)
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          npm ci --prefix sdk/ts
          npm --prefix sdk/ts run build
          tag=$([[ "${{ needs.verify.outputs.version }}" == *-* ]] && echo next || echo latest)
          npm publish ./sdk/ts --provenance --access public --tag "$tag"
      - name: Python client build
        run: |
          python3 -m pip install build==1.2.2
          python3 -m build sdk/python --outdir sdk/python/dist
      - name: Python client (PyPI trusted publishing)
        if: ${{ vars.PYPI_TRUSTED_PUBLISHING == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist
      - name: Go module tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/git/refs -f ref="refs/tags/sdk/go/${GITHUB_REF_NAME}" -f sha="${GITHUB_SHA}"
