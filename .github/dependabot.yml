# Weekly dependency updates. Security updates are raised independently of this
# schedule once "Dependabot security updates" is enabled for the repository.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /sdk/ts
    schedule:
      interval: weekly
    groups:
      ts-sdk-minor:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories: [/, /web]
    schedule:
      interval: weekly
